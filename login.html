<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aylé Café - الحساب وتسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">

    <header class="dark-nav">
        <nav class="navbar">
            <h2 class="logo">Aylé Café</h2>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="menu.html">المنيو</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" id="authBtn" class="btn-auth active">دخول / تسجيل</a>
                <button id="darkModeBtn">🌙</button>
            </div>
        </nav>
    </header>

    <section class="auth-container">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">إنشاء حساب جديد</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="pageLoginForm" onsubmit="handleLogin(event)">
                <h2>مرحباً بعودتك ☕</h2>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-block">دخول</button>
            </form>

            <!-- نموذج إنشاء حساب جديد -->
            <form id="pageRegisterForm" style="display: none;" onsubmit="handleRegister(event)">
                <h2>انضم لعائلة Aylé Café ✨</h2>
                
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="regName" placeholder="أحمد محمد" required>
                </div>

                <div class="input-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="regPhone" placeholder="01012345678" required>
                </div>

                <div class="input-group">
                    <label>العنوان بالتفصيل (للتوصيل)</label>
                    <input type="text" id="regAddress" placeholder="المدينة، الشارع، رقم العمارة أو الشقة" required>
                </div>

                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-block">إنشاء الحساب</button>
            </form>

        </div>
    </section>

    <footer>
        <h2>Aylé Café</h2>
        <p>© 2026 Aylé Café. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById("pageLoginForm");
            const regForm = document.getElementById("pageRegisterForm");
            const tabLogin = document.getElementById("tabLogin");
            const tabRegister = document.getElementById("tabRegister");

            if (tab === 'login') {
                loginForm.style.display = "block";
                regForm.style.display = "none";
                tabLogin.classList.add("active");
                tabRegister.classList.remove("active");
            } else {
                loginForm.style.display = "none";
                regForm.style.display = "block";
                tabRegister.classList.add("active");
                tabLogin.classList.remove("active");
            }
        }
    </script>
</body>
</html>
